name: Update oil price data

on:
  schedule:
    # 每日香港時間 06:10 執行，即 UTC 22:10
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-oilprice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download Consumer Council oil price JSON
        run: |
          curl -L \
            --retry 3 \
            --retry-delay 10 \
            --fail \
            --user-agent "Mozilla/5.0" \
            --header "Accept: application/json,text/plain,*/*" \
            "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json" \
            -o data/oilprice.raw.json

      - name: Validate JSON
        run: |
          python3 -m json.tool data/oilprice.raw.json > data/oilprice.formatted.json

      - name: Add metadata
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          hk_tz = timezone(timedelta(hours=8))

          with open("data/oilprice.formatted.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          wrapped = {
              "source": "香港消費者委員會油價資訊通",
              "source_url": "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json",
              "fetched_at_hkt": datetime.now(hk_tz).isoformat(timespec="seconds"),
              "data": payload
          }

          with open("data/oilprice.json", "w", encoding="utf-8") as f:
              json.dump(wrapped, f, ensure_ascii=False, indent=2)
          PY

      - name: Clean temporary files
        run: |
          rm -f data/oilprice.raw.json data/oilprice.formatted.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oilprice.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update oil price data"
            git push
          fi
