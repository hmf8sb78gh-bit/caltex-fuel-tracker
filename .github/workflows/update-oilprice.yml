name: Update Oil Price

on:
  schedule:
    # 每 5 分鐘檢查一次
    # GitHub Actions cron 使用 UTC 時間
    - cron: "*/5 * * * *"

  # 可以手動按 Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oilprice
  cancel-in-progress: false

jobs:
  update-oilprice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run oil price updater
        run: |
          python scripts/update_oilprice.py

      - name: Commit and push only if oilprice.json changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/oilprice.json

          if git diff --cached --quiet; then
            echo "No oil price changes. Nothing to commit."
          else
            git commit -m "Update oil price data"
            git pull --rebase
            git push
          fi
 
