<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>加德士油價折扣計數機</title>
  <style>
    :root {
      --bg: #070b18;
      --card: #111827;
      --border: #38455f;
      --text: #eef4ff;
      --muted: #a8b3c7;
      --muted2: #7e8aa3;
      --red: #ef4444;
      --orange: #f97316;
      --green: #22c55e;
      --input: #182235;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
      font-size: 15px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK",
        "Noto Sans HK", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.14), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.13), transparent 30rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 22px 14px 38px;
    }

    header {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(1.85rem, 6.2vw, 3rem);
      line-height: 1.08;
      margin: 0 0 14px;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(0.98rem, 3.5vw, 1.35rem);
      line-height: 1.5;
      margin: 0;
    }

    .theme-btn {
      border: 2px solid var(--border);
      background: #101827;
      color: var(--text);
      border-radius: 24px;
      min-width: 68px;
      height: 78px;
      font-size: 1.8rem;
      box-shadow: 0 14px 30px var(--shadow);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 26px 0;
    }

    .card {
      background: rgba(17, 24, 39, 0.92);
      border: 2px solid var(--border);
      border-radius: 26px;
      padding: clamp(18px, 4.5vw, 30px);
      margin-bottom: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }

    h2 {
      margin: 0 0 20px;
      font-size: clamp(1.48rem, 5.2vw, 2.15rem);
      letter-spacing: -0.03em;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #070c18;
      border: 2px solid #263149;
      border-radius: 22px;
      padding: 7px;
      margin-bottom: 16px;
      gap: 7px;
    }

    .segmented button {
      border: 0;
      border-radius: 16px;
      padding: 16px 8px;
      background: transparent;
      color: var(--muted);
      font-size: clamp(1rem, 3.8vw, 1.35rem);
      font-weight: 800;
    }

    .segmented button.active {
      background: linear-gradient(135deg, #ef4444, #f87171);
      color: white;
      box-shadow: 0 12px 28px rgba(239, 68, 68, 0.25);
    }

    .fuel-summary {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    @media (min-width: 680px) {
      .fuel-summary {
        grid-template-columns: 1fr 1fr;
        align-items: stretch;
      }
    }

    .fuel-pill {
      border: 1px solid #31405c;
      background: rgba(7, 12, 24, 0.55);
      border-radius: 18px;
      padding: 13px 14px;
    }

    .fuel-pill .k {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    .fuel-pill .v {
      color: var(--text);
      font-weight: 900;
      font-size: clamp(1.05rem, 4vw, 1.28rem);
      word-break: break-word;
    }

    /* 實際油價醒目卡（跟參考版面：右上角減幅徽章 + 刪除線牌價 + 大價） */
    .actual-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-color: rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    .actual-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .actual-card .k {
      color: rgba(255, 255, 255, 0.94);
      font-weight: 800;
      margin-bottom: 0;
    }

    .save-badge {
      background: #ffffff;
      color: #e23712;
      font-weight: 900;
      border-radius: 999px;
      padding: 5px 13px;
      font-size: clamp(0.9rem, 3.4vw, 1.02rem);
      white-space: nowrap;
    }

    .actual-list {
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(0.9rem, 3.4vw, 1.02rem);
    }

    .actual-list s {
      opacity: 0.85;
    }

    .actual-price {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(1.7rem, 6.4vw, 2.35rem);
      line-height: 1.05;
    }

    .actual-price .per {
      font-size: 0.5em;
      font-weight: 800;
      margin-left: 5px;
    }

    .notice {
      border: 2px solid rgba(239, 68, 68, 0.65);
      background: rgba(127, 29, 29, 0.22);
      color: #fecaca;
      border-radius: 20px;
      padding: 15px;
      font-size: clamp(0.95rem, 3.4vw, 1.15rem);
      line-height: 1.5;
      margin: 16px 0 0;
      display: none;
      white-space: pre-wrap;
    }

    .notice.show {
      display: block;
    }

    .price-box {
      border: 2px solid #33415d;
      background: rgba(7, 12, 24, 0.42);
      border-radius: 20px;
      padding: 16px;
      margin-top: 16px;
    }

    .price-box-title {
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 760px) {
      .price-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      margin-bottom: 16px;
    }

    @media (min-width: 760px) {
      .row.two {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      display: block;
      color: #dce8fa;
      font-size: clamp(1rem, 3.6vw, 1.18rem);
      font-weight: 700;
      margin-bottom: 9px;
    }

    input,
    select {
      width: 100%;
      border: 2px solid #4b5871;
      background: var(--input);
      color: var(--text);
      border-radius: 18px;
      padding: 14px 16px;
      font-size: clamp(1.05rem, 4vw, 1.32rem);
      outline: none;
      min-height: 56px;
    }

    select {
      appearance: auto;
      -webkit-appearance: menulist;
    }

    input:focus,
    select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      margin-top: 16px;
    }

    @media (min-width: 520px) {
      .buttons {
        grid-template-columns: 1fr 1fr;
      }
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.08s ease,
        filter 0.08s ease,
        box-shadow 0.08s ease,
        opacity 0.08s ease;
    }

    button:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }

    .btn.flash,
    .segmented button.flash,
    .theme-btn.flash {
      animation: btnFlash 0.35s ease;
    }

    @keyframes btnFlash {
      0% {
        filter: brightness(1);
      }
      45% {
        filter: brightness(1.35);
      }
      100% {
        filter: brightness(1);
      }
    }

    .btn {
      border: 0;
      border-radius: 20px;
      padding: 16px 16px;
      font-size: clamp(1.02rem, 3.8vw, 1.25rem);
      font-weight: 900;
      color: white;
      background: #46566e;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      min-height: 62px;
    }

    .btn.primary {
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    .btn.blue {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
    }

    .btn.green {
      background: linear-gradient(135deg, #16a34a, #22c55e);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
    }

    @media (min-width: 760px) {
      .result-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .result {
      background: rgba(7, 12, 24, 0.62);
      border: 1px solid #2f3b55;
      border-radius: 20px;
      padding: 16px;
    }

    .result .k {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 7px;
    }

    .result .v {
      font-size: clamp(1.25rem, 4.6vw, 1.7rem);
      font-weight: 900;
      color: white;
      word-break: break-word;
    }

    .result.highlight {
      border-color: rgba(250, 204, 21, 0.65);
      background: rgba(113, 63, 18, 0.28);
    }

    .result.main {
      border-color: rgba(34, 197, 94, 0.65);
      background: rgba(20, 83, 45, 0.25);
    }

    .small {
      font-size: 0.88rem;
      color: var(--muted2);
      line-height: 1.5;
      margin-top: 13px;
    }

    .voucher-hint {
      font-size: 0.86rem;
      line-height: 1.5;
      margin-top: 8px;
      color: var(--muted2);
    }

    .voucher-hint.warn {
      color: #fca5a5;
    }

    body.light .voucher-hint.warn {
      color: #b91c1c;
    }

    .footer {
      color: var(--muted2);
      font-size: 0.84rem;
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    code {
      color: inherit;
    }

    body.light {
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --muted2: #64748b;
      --input: #ffffff;
      background:
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.13), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30rem),
        var(--bg);
    }

    body.light .card {
      background: rgba(255, 255, 255, 0.94);
    }

    body.light .segmented {
      background: #e7edf6;
    }

    body.light .fuel-pill,
    body.light .price-box,
    body.light .result {
      background: rgba(241, 245, 249, 0.88);
    }

    body.light .actual-card {
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    body.light .result.main {
      background: rgba(220, 252, 231, 0.95);
    }

    body.light .result.highlight {
      background: rgba(254, 249, 195, 0.95);
    }

    body.light .result .v {
      color: #0f172a;
    }

    body.light .theme-btn {
      background: #ffffff;
    }

    body.light label {
      color: #1e293b;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>加德士油價折扣計數機</h1>
        <p class="subtitle">
          自動讀取每日油價，計算折扣、油券、實付金額及每公里油費。
        </p>
      </div>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="切換深淺色">☀️</button>
    </header>

    <div class="divider"></div>

    <section class="card">
      <h2>選擇燃油種類</h2>

      <div class="segmented">
        <button type="button" id="goldBtn" class="active">黃金（平油）</button>
        <button type="button" id="platinumBtn">白金（貴油）</button>
      </div>

      <div class="fuel-summary">
        <div class="fuel-pill">
          <div class="k">牌價</div>
          <div class="v" id="topPumpPrice">--</div>
        </div>

        <div class="fuel-pill actual-card">
          <div class="actual-top">
            <span class="k">實際油價</span>
            <span class="save-badge" id="topSavePerLitre">減 $--</span>
          </div>
          <div class="actual-list" id="topListPrice">牌價：--</div>
          <div class="actual-price"><span id="topRealPerLitre">--</span><span class="per">/升</span></div>
        </div>
      </div>

      <div id="loadStatus" class="notice"></div>

      <div id="manualBox" class="price-box hidden">
        <div class="price-box-title">未能自動讀取油價，可手動輸入</div>

        <div class="price-row">
          <div>
            <label for="manualGoldPrice">黃金油價，每升 HK$</label>
            <input id="manualGoldPrice" type="number" inputmode="decimal" step="0.01" placeholder="例如 32.67" />
          </div>
          <div>
            <label for="manualPlatinumPrice">白金油價，每升 HK$</label>
            <input id="manualPlatinumPrice" type="number" inputmode="decimal" step="0.01" placeholder="例如 34.47" />
          </div>
        </div>

        <div class="buttons">
          <button type="button" class="btn primary" id="applyManualBtn">套用手動油價</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>折扣及入油資料</h2>

      <div class="row two">
        <div>
          <label for="discountCard">折扣卡</label>
          <select id="discountCard">
            <option value="11,12">私人能源卡：黃金減$11 / 白金減$12</option>
            <option value="10,11">一般折扣：黃金減$10 / 白金減$11</option>
            <option value="9,10">一般折扣：黃金減$9 / 白金減$10</option>
            <option value="0,0">沒有折扣卡</option>
            <option value="custom">自訂折扣</option>
          </select>
        </div>

        <div id="customDiscountBox" class="hidden">
          <label for="customDiscount">自訂每升油卡折扣 HK$</label>
          <input id="customDiscount" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>
      </div>

      <div class="row two">
        <div>
          <label for="voucher">油券</label>
          <select id="voucher">
            <option value="50">每滿$350減$50（可疊加）</option>
            <option value="40">每滿$350減$40（可疊加）</option>
            <option value="30">每滿$350減$30（可疊加）</option>
            <option value="0">沒有油券</option>
            <option value="custom">自訂油券面額（每滿$350一張）</option>
          </select>
          <div class="voucher-hint" id="voucherHint"></div>
        </div>

        <div id="customVoucherBox" class="hidden">
          <label for="customVoucher">自訂油券金額 HK$</label>
          <input id="customVoucher" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>
      </div>

      <div class="row two">
        <div>
          <label for="litres">今次入油量，升</label>
          <input id="litres" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>

        <div>
          <label for="lastOdometer">上次入油總里數，公里</label>
          <input id="lastOdometer" type="number" inputmode="decimal" step="0.1" placeholder="例如 110420" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="currentOdometer">今次入油總里數，公里</label>
          <input id="currentOdometer" type="number" inputmode="decimal" step="0.1" placeholder="例如 110820" />
        </div>
      </div>

      <div class="buttons">
        <button type="button" class="btn primary" id="calcBtn">計算</button>
        <button type="button" class="btn green" id="saveOdometerBtn">儲存今次里數作下次起點</button>
        <button type="button" class="btn blue" id="resetBtn">重設輸入</button>
        <button type="button" class="btn" id="clearMemoryBtn">清除記憶</button>
      </div>
    </section>

    <section class="card" id="resultSection">
      <h2>計算結果</h2>

      <div class="result-grid">
        <div class="result highlight">
          <div class="k">實付金額</div>
          <div class="v" id="resultPay">--</div>
        </div>

        <div class="result main">
          <div class="k">每公里油費</div>
          <div class="v" id="resultCostPerKm">--</div>
        </div>

        <div class="result">
          <div class="k">今次行駛距離</div>
          <div class="v" id="resultDistanceKm">--</div>
        </div>

        <div class="result">
          <div class="k">油耗</div>
          <div class="v" id="resultFuelConsumption">--</div>
        </div>
      </div>

      <p class="small" id="updatedAtText">尚未載入油價。</p>
    </section>

    <div class="footer" id="footerInfo">
      油價資料來源：香港消費者委員會油價資訊通。<br />
      更新時間：尚未載入。
    </div>
  </div>

  <script>
    const OIL_PRICE_API_URL = "./data/oilprice.json";
    const STORAGE_KEY = "caltexCalcStateV8";
    const VOUCHER_STEP = 350; // 每滿 HK$350 牌價總額疊一張油券（張數 = floor(牌價總額 / 350)）

    const DEFAULT_PRICES = {
      gold: null,
      platinum: null,
      updatedAt: "",
      loadedAt: "",
      source: "消委會油價資訊通"
    };

    let appState = {
      fuelType: "gold",
      prices: { ...DEFAULT_PRICES }
    };

    const $ = (id) => document.getElementById(id);

    const els = {
      goldBtn: $("goldBtn"),
      platinumBtn: $("platinumBtn"),

      topPumpPrice: $("topPumpPrice"),
      topSavePerLitre: $("topSavePerLitre"),
      topListPrice: $("topListPrice"),
      topRealPerLitre: $("topRealPerLitre"),

      manualBox: $("manualBox"),
      manualGoldPrice: $("manualGoldPrice"),
      manualPlatinumPrice: $("manualPlatinumPrice"),
      applyManualBtn: $("applyManualBtn"),
      loadStatus: $("loadStatus"),

      discountCard: $("discountCard"),
      customDiscountBox: $("customDiscountBox"),
      customDiscount: $("customDiscount"),
      voucher: $("voucher"),
      customVoucherBox: $("customVoucherBox"),
      customVoucher: $("customVoucher"),
      voucherHint: $("voucherHint"),

      litres: $("litres"),
      lastOdometer: $("lastOdometer"),
      currentOdometer: $("currentOdometer"),

      calcBtn: $("calcBtn"),
      saveOdometerBtn: $("saveOdometerBtn"),
      resetBtn: $("resetBtn"),
      clearMemoryBtn: $("clearMemoryBtn"),
      themeBtn: $("themeBtn"),

      resultSection: $("resultSection"),
      resultPay: $("resultPay"),
      resultCostPerKm: $("resultCostPerKm"),
      resultDistanceKm: $("resultDistanceKm"),
      resultFuelConsumption: $("resultFuelConsumption"),
      updatedAtText: $("updatedAtText"),
      footerInfo: $("footerInfo")
    };

    function money(n) {
      if (!Number.isFinite(n)) return "--";
      return "HK$" + n.toFixed(2);
    }

    function numberValue(el, fallback = 0) {
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }

    function nowText() {
      return new Date().toLocaleString("zh-HK", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function showStatus(message) {
      els.loadStatus.textContent = message;
      els.loadStatus.className = "notice show";
    }

    function hideStatus() {
      els.loadStatus.textContent = "";
      els.loadStatus.className = "notice";
    }

    function flashButton(button) {
      if (!button) return;
      button.classList.remove("flash");
      void button.offsetWidth;
      button.classList.add("flash");
      setTimeout(() => {
        button.classList.remove("flash");
      }, 380);
    }

    function updateFooterTime() {
      const time =
        appState.prices.loadedAt ||
        appState.prices.updatedAt ||
        "尚未載入";

      els.footerInfo.innerHTML =
        "油價資料來源：香港消費者委員會油價資訊通。<br />" +
        "更新時間：" +
        time +
        "。";
    }

    function saveState() {
      const data = {
        version: 8,
        fuelType: appState.fuelType,
        prices: appState.prices,

        manualGoldPrice: els.manualGoldPrice.value,
        manualPlatinumPrice: els.manualPlatinumPrice.value,

        discountCard: els.discountCard.value,
        customDiscount: els.customDiscount.value,

        voucher: els.voucher.value,
        customVoucher: els.customVoucher.value,

        litres: els.litres.value,
        lastOdometer: els.lastOdometer.value,
        currentOdometer: els.currentOdometer.value,

        theme: document.body.classList.contains("light") ? "light" : "dark"
      };

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY) ||
          localStorage.getItem("caltexCalcStateV7") ||
          localStorage.getItem("caltexCalcStateV6") ||
          localStorage.getItem("caltexCalcStateV5") ||
          localStorage.getItem("caltexCalcStateV4");

        if (!raw) return;

        const data = JSON.parse(raw);

        if (data.fuelType) appState.fuelType = data.fuelType;

        if (data.prices) {
          appState.prices = {
            ...DEFAULT_PRICES,
            ...data.prices
          };
        }

        if (data.manualGoldPrice != null) {
          els.manualGoldPrice.value = data.manualGoldPrice;
        }

        if (data.manualPlatinumPrice != null) {
          els.manualPlatinumPrice.value = data.manualPlatinumPrice;
        }

        if (data.discountCard != null) els.discountCard.value = data.discountCard;
        if (data.customDiscount != null) els.customDiscount.value = data.customDiscount;

        if (data.voucher != null) els.voucher.value = data.voucher;
        if (data.customVoucher != null) els.customVoucher.value = data.customVoucher;

        if (data.litres != null) els.litres.value = data.litres;
        if (data.lastOdometer != null) els.lastOdometer.value = data.lastOdometer;
        if (data.currentOdometer != null) els.currentOdometer.value = data.currentOdometer;

        if (data.theme === "light") {
          document.body.classList.add("light");
          els.themeBtn.textContent = "🌙";
        } else {
          document.body.classList.remove("light");
          els.themeBtn.textContent = "☀️";
        }
      } catch (e) {}
    }

    function setFuelType(type) {
      appState.fuelType = type;
      els.goldBtn.classList.toggle("active", type === "gold");
      els.platinumBtn.classList.toggle("active", type === "platinum");
      calculate(false);
      saveState();
    }

    function getCurrentPumpPrice() {
      return appState.fuelType === "gold"
        ? Number(appState.prices.gold)
        : Number(appState.prices.platinum);
    }

    function getDiscountPerLitre() {
      if (els.discountCard.value === "custom") {
        return numberValue(els.customDiscount, 0);
      }

      const parts = els.discountCard.value.split(",").map(Number);
      const goldDiscount = parts[0] || 0;
      const platinumDiscount = parts[1] || 0;

      return appState.fuelType === "gold" ? goldDiscount : platinumDiscount;
    }

    function getVoucherAmount() {
      if (els.voucher.value === "custom") {
        return numberValue(els.customVoucher, 0);
      }
      return Number(els.voucher.value) || 0;
    }

    function getDistanceKm() {
      const last = numberValue(els.lastOdometer, NaN);
      const current = numberValue(els.currentOdometer, NaN);

      if (!Number.isFinite(last) || !Number.isFinite(current)) return NaN;

      const distance = current - last;
      if (!Number.isFinite(distance) || distance <= 0) return NaN;

      return distance;
    }

    function updateCustomFieldsVisibility() {
      els.customDiscountBox.classList.toggle("hidden", els.discountCard.value !== "custom");
      els.customVoucherBox.classList.toggle("hidden", els.voucher.value !== "custom");
    }

    function calculateEffectiveValues() {
      const pumpPrice = getCurrentPumpPrice();
      const cardDiscount = getDiscountPerLitre(); // 折扣卡基本折扣 HK$/升
      const litres = numberValue(els.litres, 0);
      const voucherPerSheet = getVoucherAmount(); // 單張油券面額

      const empty = {
        pumpPrice,
        cardDiscount,
        litres,
        voucherPerSheet,
        voucherSheets: 0,
        voucher: 0,
        listTotal: NaN,
        billedAmount: NaN,
        billedLitres: NaN,
        cardDiscountTotal: NaN,
        cardNetPerLitre: NaN,
        payable: NaN,
        realPerLitre: NaN
      };

      if (!Number.isFinite(pumpPrice) || pumpPrice <= 0) {
        return empty;
      }

      const safeLitres = Math.max(0, litres);

      // ① 牌價總額 gross = 牌價 × 實際入油量
      const listTotal = pumpPrice * safeLitres;

      // ② 油券：每滿 HK$350 一張、可疊加，張數 = floor(gross / 350)
      const voucherSheets =
        voucherPerSheet > 0 && listTotal > 0
          ? Math.floor(listTotal / VOUCHER_STEP)
          : 0;
      const voucher = voucherSheets * voucherPerSheet;

      // ③ 計入帳單金額 = gross − 油券；計入帳單入油量 = 計入帳單金額 / 牌價
      const billedAmount = Math.max(0, listTotal - voucher);
      const billedLitres = billedAmount / pumpPrice;

      // ④ 卡折 = 基本折扣/升 × 計入帳單入油量（油券墊住嘅部份唔再享卡折扣）
      const cardNetPerLitre = Math.max(0, pumpPrice - cardDiscount);
      const cardDiscountTotal = cardDiscount * billedLitres;

      // ⑤ 應付金額 = 計入帳單金額 − 卡折
      const payable = Math.max(0, billedAmount - cardDiscountTotal);

      // ⑥ 最終油價（實際每升）= 應付金額 / 實際入油量
      const realPerLitre =
        safeLitres > 0 ? payable / safeLitres : cardNetPerLitre;

      return {
        pumpPrice,
        cardDiscount,
        litres,
        voucherPerSheet,
        voucherSheets,
        voucher,
        listTotal,
        billedAmount,
        billedLitres,
        cardDiscountTotal,
        cardNetPerLitre,
        payable,
        realPerLitre
      };
    }

    function updateVoucherHint(values) {
      const hint = els.voucherHint;
      if (!hint) return;

      if (!Number.isFinite(values.listTotal) || !(values.voucherPerSheet > 0)) {
        hint.textContent = "";
        hint.className = "voucher-hint";
        return;
      }

      if (values.voucherSheets > 0) {
        const remainder = VOUCHER_STEP - (values.listTotal % VOUCHER_STEP);
        let text =
          "牌價總額 HK$" + values.listTotal.toFixed(2) +
          "，每滿 HK$350 一張，共用 " + values.voucherSheets +
          " 張、共減 HK$" + values.voucher.toFixed(2) + "。";
        if (remainder > 0.01) {
          text += " 再入約 HK$" + remainder.toFixed(2) + " 牌價可多疊一張。";
        }
        hint.textContent = text;
        hint.className = "voucher-hint";
      } else {
        const diff = VOUCHER_STEP - values.listTotal;
        hint.textContent =
          "牌價總額 HK$" + values.listTotal.toFixed(2) +
          "，未滿 HK$350（差 HK$" + diff.toFixed(2) + "），暫未用券。";
        hint.className = "voucher-hint warn";
      }
    }

    function updateTopFuelSummary(values) {
      els.topPumpPrice.textContent = money(values.pumpPrice);

      if (Number.isFinite(values.realPerLitre) && Number.isFinite(values.pumpPrice)) {
        const savePerLitre = values.pumpPrice - values.realPerLitre;
        els.topSavePerLitre.textContent = "減 $" + savePerLitre.toFixed(2);
        els.topListPrice.innerHTML = "牌價：<s>" + money(values.pumpPrice) + "</s>";
        els.topRealPerLitre.textContent = money(values.realPerLitre);
      } else {
        els.topSavePerLitre.textContent = "減 $--";
        els.topListPrice.textContent = "牌價：--";
        els.topRealPerLitre.textContent = "--";
      }
    }

    function calculate(shouldScroll = false) {
      updateCustomFieldsVisibility();

      const values = calculateEffectiveValues();
      const distanceKm = getDistanceKm();

      updateTopFuelSummary(values);
      updateVoucherHint(values);

      if (!Number.isFinite(values.pumpPrice) || values.pumpPrice <= 0) {
        els.resultPay.textContent = "--";
        els.resultCostPerKm.textContent = "--";
        els.resultDistanceKm.textContent = Number.isFinite(distanceKm)
          ? distanceKm.toFixed(1) + " km"
          : "--";
        els.resultFuelConsumption.textContent = "--";
        els.updatedAtText.textContent = "尚未載入有效油價。";
        updateFooterTime();
        saveState();

        if (shouldScroll) scrollToResults();
        return;
      }

      const costPerKm =
        Number.isFinite(distanceKm) && distanceKm > 0
          ? values.payable / distanceKm
          : NaN;

      const fuelConsumption =
        Number.isFinite(distanceKm) && distanceKm > 0 && values.litres > 0
          ? (values.litres / distanceKm) * 100
          : NaN;

      els.resultPay.textContent = money(values.payable);
      els.resultCostPerKm.textContent = Number.isFinite(costPerKm)
        ? money(costPerKm) + " / km"
        : "--";
      els.resultDistanceKm.textContent = Number.isFinite(distanceKm)
        ? distanceKm.toFixed(1) + " km"
        : "--";
      els.resultFuelConsumption.textContent = Number.isFinite(fuelConsumption)
        ? fuelConsumption.toFixed(2) + " L / 100km"
        : "--";

      const time =
        appState.prices.loadedAt ||
        appState.prices.updatedAt ||
        "油價已載入";

      els.updatedAtText.textContent =
        "更新時間：" +
        time +
        "｜資料來源：" +
        (appState.prices.source || "消委會油價資訊通");

      updateFooterTime();
      saveState();

      if (shouldScroll) scrollToResults();
    }

    function scrollToResults() {
      setTimeout(() => {
        els.resultSection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 80);
    }

    async function fetchOilPriceData() {
      const url = OIL_PRICE_API_URL + "?t=" + Date.now();

      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status + "，可能 data/oilprice.json 尚未建立");
      }

      return await response.json();
    }

    function flattenJson(value, output = [], path = "") {
      if (Array.isArray(value)) {
        value.forEach((item, index) => {
          flattenJson(item, output, path + "[" + index + "]");
        });
      } else if (value && typeof value === "object") {
        output.push({
          path,
          value
        });

        Object.keys(value).forEach((key) => {
          const child = value[key];
          flattenJson(child, output, path ? path + "." + key : key);
        });
      }

      return output;
    }

    function normalizeText(value) {
      return String(value == null ? "" : value)
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/－/g, "-")
        .replace(/–/g, "-")
        .replace(/—/g, "-");
    }

    function stringifyObject(obj) {
      try {
        return normalizeText(JSON.stringify(obj));
      } catch (e) {
        return "";
      }
    }

    function parsePriceCandidate(value) {
      if (value == null) return null;

      if (typeof value === "number" && Number.isFinite(value)) {
        if (value >= 10 && value <= 60) return value;
        return null;
      }

      const str = String(value)
        .replace(/HKD/gi, "")
        .replace(/HK\$/gi, "")
        .replace(/港幣/g, "")
        .replace(/每公升/g, "")
        .replace(/每升/g, "")
        .replace(/\$/g, "")
        .replace(/,/g, "")
        .trim();

      const matches = str.match(/\d+(?:\.\d+)?/g);
      if (!matches) return null;

      for (const m of matches) {
        const n = Number(m);
        if (Number.isFinite(n) && n >= 10 && n <= 60) {
          return n;
        }
      }

      return null;
    }

    function extractAllPricesFromObject(obj) {
      const found = [];

      function walk(value, keyPath = "") {
        if (value == null) return;

        if (Array.isArray(value)) {
          value.forEach((item, index) => walk(item, keyPath + "[" + index + "]"));
          return;
        }

        if (typeof value === "object") {
          Object.keys(value).forEach((key) => {
            walk(value[key], keyPath ? keyPath + "." + key : key);
          });
          return;
        }

        const price = parsePriceCandidate(value);
        if (price != null) {
          found.push({
            price,
            keyPath,
            raw: value
          });
        }
      }

      walk(obj);
      return found;
    }

    function hasAny(text, keywords) {
      return keywords.some((kw) => text.includes(normalizeText(kw)));
    }

    function scoreCandidate(rowText, pathText, priceInfo, target) {
      const text = rowText + " " + pathText + " " + normalizeText(priceInfo.keyPath);

      let score = 0;

      if (hasAny(text, ["caltex", "加德士", "加德士石油"])) score += 100;
      if (hasAny(text, ["techron"])) score += 30;

      if (target === "gold") {
        if (hasAny(text, ["gold", "黃金", "黃金汽油"])) score += 80;
        if (hasAny(text, ["platinum", "白金", "premium"])) score -= 80;
      }

      if (target === "platinum") {
        if (hasAny(text, ["platinum", "白金", "白金汽油", "premium"])) score += 80;
        if (hasAny(text, ["gold", "黃金"])) score -= 80;
      }

      if (hasAny(text, ["price", "油價", "牌價", "retail", "pump"])) score += 20;
      if (hasAny(text, ["discount", "折扣", "優惠", "coupon", "voucher"])) score -= 70;

      return score;
    }

    function pickBestPrice(entries, target) {
      let best = null;

      for (const entry of entries) {
        const rowText = stringifyObject(entry.value);
        const pathText = normalizeText(entry.path);
        const prices = extractAllPricesFromObject(entry.value);

        for (const priceInfo of prices) {
          const score = scoreCandidate(rowText, pathText, priceInfo, target);

          if (!best || score > best.score) {
            best = {
              price: priceInfo.price,
              score,
              path: entry.path,
              keyPath: priceInfo.keyPath,
              raw: priceInfo.raw
            };
          }
        }
      }

      if (!best || best.score < 80) {
        return null;
      }

      return best;
    }

    function extractUpdatedAt(payload, wrapper) {
      if (wrapper && wrapper.fetched_at_hkt) {
        return wrapper.fetched_at_hkt;
      }

      if (wrapper && wrapper.updated_at) {
        return wrapper.updated_at;
      }

      if (payload && payload.updated_at) {
        return payload.updated_at;
      }

      const text = stringifyObject(payload);
      const isoMatch = text.match(/\d{4}-\d{2}-\d{2}[t\s]\d{2}:\d{2}(?::\d{2})?/);
      if (isoMatch) return isoMatch[0];

      const dateMatch = text.match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
      if (dateMatch) return dateMatch[0];

      return nowText();
    }

    function parseConsumerCouncilOilPrices(wrapper) {
      const payload = wrapper && wrapper.data ? wrapper.data : wrapper;

      // 直接按已知結構讀取，唔再靠關鍵字評分（否則最外層節點同時含黃金/白金會互相抵銷、兩邊都揀中第一個數）
      const readPrice = (node) => {
        if (node == null) return null;
        if (typeof node === "number" && Number.isFinite(node)) return node;
        if (typeof node === "object") return parsePriceCandidate(node.price);
        return parsePriceCandidate(node);
      };

      let gold = readPrice(payload ? payload.gold : null);
      let platinum = readPrice(payload ? payload.platinum : null);

      // 後備：萬一 JSON 結構改咗，先至用返通用評分解析
      if (gold == null || platinum == null) {
        const entries = flattenJson(payload);
        if (gold == null) {
          const g = pickBestPrice(entries, "gold");
          if (g) gold = g.price;
        }
        if (platinum == null) {
          const p = pickBestPrice(entries, "platinum");
          if (p) platinum = p.price;
        }
      }

      if (gold == null && platinum == null) {
        throw new Error("已讀取 data/oilprice.json，但搵唔到加德士黃金 / 白金油價");
      }

      const readTime = extractUpdatedAt(payload, wrapper);

      return {
        gold: gold,
        platinum: platinum,
        updatedAt: readTime,
        loadedAt: readTime,
        source: wrapper && wrapper.source
          ? wrapper.source
          : "香港消費者委員會油價資訊通"
      };
    }

    async function reloadOilPrices() {
      hideStatus();

      try {
        const data = await fetchOilPriceData();
        const prices = parseConsumerCouncilOilPrices(data);

        appState.prices = {
          ...appState.prices,
          gold: prices.gold != null ? prices.gold : appState.prices.gold,
          platinum: prices.platinum != null ? prices.platinum : appState.prices.platinum,
          updatedAt: prices.updatedAt,
          loadedAt: prices.loadedAt,
          source: prices.source
        };

        if (appState.prices.gold != null) {
          els.manualGoldPrice.value = Number(appState.prices.gold).toFixed(2);
        }

        if (appState.prices.platinum != null) {
          els.manualPlatinumPrice.value = Number(appState.prices.platinum).toFixed(2);
        }

        els.manualBox.classList.add("hidden");
        hideStatus();
        calculate(false);
        saveState();
      } catch (error) {
        console.error(error);

        showStatus(
          "未能自動讀取油價，請手動輸入油價。"
        );

        els.manualBox.classList.remove("hidden");
        calculate(false);
      }
    }

    function applyManualPrices() {
      const gold = numberValue(els.manualGoldPrice, NaN);
      const platinum = numberValue(els.manualPlatinumPrice, NaN);

      if (!Number.isFinite(gold) && !Number.isFinite(platinum)) {
        showStatus("請至少輸入一個有效油價。");
        return;
      }

      if (Number.isFinite(gold) && gold > 0) {
        appState.prices.gold = gold;
      }

      if (Number.isFinite(platinum) && platinum > 0) {
        appState.prices.platinum = platinum;
      }

      const manualTime = nowText();

      appState.prices.updatedAt = manualTime;
      appState.prices.loadedAt = manualTime;
      appState.prices.source = "手動輸入";

      hideStatus();
      calculate(false);
      saveState();
    }

    function saveCurrentOdometerAsLast() {
      const current = numberValue(els.currentOdometer, NaN);

      if (!Number.isFinite(current) || current <= 0) {
        showStatus("請先輸入有效嘅「今次入油總里數」。");
        return;
      }

      els.lastOdometer.value = current.toFixed(1);
      els.currentOdometer.value = "";

      hideStatus();
      calculate(false);
      saveState();
    }

    function resetInputsOnly() {
      els.litres.value = "0";
      els.currentOdometer.value = "";
      calculate(false);
      saveState();
    }

    function clearMemory() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem("caltexCalcStateV8");
        localStorage.removeItem("caltexCalcStateV7");
        localStorage.removeItem("caltexCalcStateV6");
        localStorage.removeItem("caltexCalcStateV5");
        localStorage.removeItem("caltexCalcStateV4");
      } catch (e) {}

      appState = {
        fuelType: "gold",
        prices: { ...DEFAULT_PRICES }
      };

      els.discountCard.value = "11,12";
      els.customDiscount.value = "0";
      els.voucher.value = "50";
      els.customVoucher.value = "0";
      els.litres.value = "0";
      els.lastOdometer.value = "";
      els.currentOdometer.value = "";
      els.manualGoldPrice.value = "";
      els.manualPlatinumPrice.value = "";
      els.manualBox.classList.add("hidden");

      document.body.classList.remove("light");
      els.themeBtn.textContent = "☀️";

      setFuelType("gold");
      hideStatus();
      calculate(false);
      reloadOilPrices();
    }

    function bindEvents() {
      els.goldBtn.addEventListener("click", () => {
        flashButton(els.goldBtn);
        setFuelType("gold");
      });

      els.platinumBtn.addEventListener("click", () => {
        flashButton(els.platinumBtn);
        setFuelType("platinum");
      });

      els.applyManualBtn.addEventListener("click", () => {
        flashButton(els.applyManualBtn);
        applyManualPrices();
      });

      [
        els.discountCard,
        els.customDiscount,
        els.voucher,
        els.customVoucher,
        els.litres,
        els.lastOdometer,
        els.currentOdometer,
        els.manualGoldPrice,
        els.manualPlatinumPrice
      ].forEach((el) => {
        el.addEventListener("input", () => {
          calculate(false);
          saveState();
        });

        el.addEventListener("change", () => {
          calculate(false);
          saveState();
        });
      });

      els.calcBtn.addEventListener("click", () => {
        flashButton(els.calcBtn);
        hideStatus();
        calculate(true);
      });

      els.saveOdometerBtn.addEventListener("click", () => {
        flashButton(els.saveOdometerBtn);
        saveCurrentOdometerAsLast();
      });

      els.resetBtn.addEventListener("click", () => {
        flashButton(els.resetBtn);
        resetInputsOnly();
      });

      els.clearMemoryBtn.addEventListener("click", () => {
        flashButton(els.clearMemoryBtn);
        clearMemory();
      });

      els.themeBtn.addEventListener("click", () => {
        flashButton(els.themeBtn);
        document.body.classList.toggle("light");
        els.themeBtn.textContent = document.body.classList.contains("light") ? "🌙" : "☀️";
        saveState();
      });
    }

    function init() {
      bindEvents();
      loadState();

      if (appState.fuelType === "platinum") {
        setFuelType("platinum");
      } else {
        setFuelType("gold");
      }

      if (appState.prices.gold != null) {
        els.manualGoldPrice.value = Number(appState.prices.gold).toFixed(2);
      }

      if (appState.prices.platinum != null) {
        els.manualPlatinumPrice.value = Number(appState.prices.platinum).toFixed(2);
      }

      calculate(false);
      reloadOilPrices();
    }

    init();
  </script>
</body>
