<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>加德士油價折扣計數機</title>
  <style>
    :root {
      --bg: #070b18;
      --card: #111827;
      --border: #38455f;
      --text: #eef4ff;
      --muted: #a8b3c7;
      --muted2: #7e8aa3;
      --red: #ef4444;
      --input: #182235;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK",
        "Noto Sans HK", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.14), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.13), transparent 30rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 26px 16px 42px;
    }

    header {
      display: flex;
      gap: 14px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.4rem);
      line-height: 1.05;
      margin: 0 0 18px;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(1.05rem, 4vw, 1.55rem);
      line-height: 1.55;
      margin: 0;
    }

    .theme-btn {
      border: 2px solid var(--border);
      background: #101827;
      color: var(--text);
      border-radius: 28px;
      min-width: 78px;
      height: 92px;
      font-size: 2.1rem;
      box-shadow: 0 14px 30px var(--shadow);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    .card {
      background: rgba(17, 24, 39, 0.92);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: clamp(20px, 5vw, 34px);
      margin-bottom: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }

    h2 {
      margin: 0 0 24px;
      font-size: clamp(1.7rem, 6vw, 2.45rem);
      letter-spacing: -0.03em;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #070c18;
      border: 2px solid #263149;
      border-radius: 24px;
      padding: 8px;
      margin-bottom: 22px;
      gap: 8px;
    }

    .segmented button {
      border: 0;
      border-radius: 18px;
      padding: 18px 10px;
      background: transparent;
      color: var(--muted);
      font-size: clamp(1.15rem, 4.5vw, 1.55rem);
      font-weight: 800;
    }

    .segmented button.active {
      background: linear-gradient(135deg, #ef4444, #f87171);
      color: white;
      box-shadow: 0 12px 28px rgba(239, 68, 68, 0.25);
    }

    .notice {
      border: 2px solid rgba(239, 68, 68, 0.65);
      background: rgba(127, 29, 29, 0.22);
      color: #fecaca;
      border-radius: 22px;
      padding: 18px;
      font-size: clamp(1rem, 3.8vw, 1.3rem);
      line-height: 1.55;
      margin: 18px 0;
      display: none;
    }

    .notice.show {
      display: block;
    }

    .success {
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(20, 83, 45, 0.22);
      color: #bbf7d0;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (min-width: 760px) {
      .row.two {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      display: block;
      color: #dce8fa;
      font-size: clamp(1.12rem, 4vw, 1.35rem);
      font-weight: 700;
      margin-bottom: 10px;
    }

    input,
    select {
      width: 100%;
      border: 2px solid #4b5871;
      background: var(--input);
      color: var(--text);
      border-radius: 20px;
      padding: 16px 18px;
      font-size: clamp(1.2rem, 4.7vw, 1.55rem);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    @media (min-width: 520px) {
      .buttons {
        grid-template-columns: 1fr 1fr;
      }
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      border: 0;
      border-radius: 22px;
      padding: 18px 18px;
      font-size: clamp(1.15rem, 4.5vw, 1.45rem);
      font-weight: 900;
      color: white;
      background: #46566e;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .btn.primary {
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    .btn.blue {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 760px) {
      .result-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .result {
      background: rgba(7, 12, 24, 0.62);
      border: 1px solid #2f3b55;
      border-radius: 22px;
      padding: 18px;
    }

    .result .k {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .result .v {
      font-size: clamp(1.45rem, 5.2vw, 2rem);
      font-weight: 900;
      color: white;
      word-break: break-word;
    }

    .result.highlight {
      border-color: rgba(250, 204, 21, 0.65);
      background: rgba(113, 63, 18, 0.28);
    }

    .small {
      font-size: 0.95rem;
      color: var(--muted2);
      line-height: 1.5;
      margin-top: 14px;
    }

    .footer {
      color: var(--muted2);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 28px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    .manual-box {
      margin-top: 18px;
      border-top: 1px solid #33415d;
      padding-top: 18px;
    }

    body.light {
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --muted2: #64748b;
      --input: #ffffff;
      background:
        radial-gradient(circle at top left, rgba(239, 68, 68, 0.13), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30rem),
        var(--bg);
    }

    body.light .card {
      background: rgba(255, 255, 255, 0.94);
    }

    body.light .segmented {
      background: #e7edf6;
    }

    body.light .result {
      background: rgba(241, 245, 249, 0.88);
    }

    body.light .result .v {
      color: #0f172a;
    }

    body.light .theme-btn {
      background: #ffffff;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>加德士油價折扣計數機</h1>
        <p class="subtitle">
          每日由 GitHub Actions 儲存消委會油價資訊通資料，並計算折扣、油券及汽車油耗。
        </p>
      </div>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="切換深淺色">☀️</button>
    </header>

    <div class="divider"></div>

    <section class="card">
      <h2>選擇燃油種類</h2>

      <div class="segmented">
        <button type="button" id="goldBtn" class="active">黃金（平油）</button>
        <button type="button" id="platinumBtn">白金（貴油）</button>
      </div>

      <div id="loadStatus" class="notice"></div>

      <div class="buttons">
        <button type="button" class="btn" id="reloadPriceBtn">重新讀取本地油價</button>
        <button type="button" class="btn" id="manualToggleBtn">手動輸入油價</button>
      </div>

      <div id="manualBox" class="manual-box hidden">
        <div class="row two">
          <div>
            <label for="manualGoldPrice">黃金油價，每升 HK$</label>
            <input id="manualGoldPrice" type="number" inputmode="decimal" step="0.01" placeholder="例如 24.99" />
          </div>
          <div>
            <label for="manualPlatinumPrice">白金油價，每升 HK$</label>
            <input id="manualPlatinumPrice" type="number" inputmode="decimal" step="0.01" placeholder="例如 26.99" />
          </div>
        </div>
        <button type="button" class="btn primary" id="applyManualBtn">套用手動油價</button>
      </div>
    </section>

    <section class="card">
      <h2>折扣及入油資料</h2>

      <div class="row two">
        <div>
          <label for="discountCard">折扣卡</label>
          <select id="discountCard">
            <option value="11,12">私人能源卡：黃金減$11 / 白金減$12</option>
            <option value="10,11">一般折扣：黃金減$10 / 白金減$11</option>
            <option value="9,10">一般折扣：黃金減$9 / 白金減$10</option>
            <option value="0,0">沒有折扣卡</option>
            <option value="custom">自訂折扣</option>
          </select>
        </div>

        <div id="customDiscountBox" class="hidden">
          <label for="customDiscount">自訂每升折扣 HK$</label>
          <input id="customDiscount" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>
      </div>

      <div class="row two">
        <div>
          <label for="voucher">油券</label>
          <select id="voucher">
            <option value="50">私人能源卡：入滿$350減$50</option>
            <option value="40">入滿指定金額減$40</option>
            <option value="30">入滿指定金額減$30</option>
            <option value="0">沒有油券</option>
            <option value="custom">自訂油券</option>
          </select>
        </div>

        <div id="customVoucherBox" class="hidden">
          <label for="customVoucher">自訂油券金額 HK$</label>
          <input id="customVoucher" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>
      </div>

      <div class="row two">
        <div>
          <label for="litres">入油量，升</label>
          <input id="litres" type="number" inputmode="decimal" step="0.01" value="0" />
        </div>

        <div>
          <label for="odometerKm">行駛里數，公里，可留空</label>
          <input id="odometerKm" type="number" inputmode="decimal" step="0.1" placeholder="例如 420" />
        </div>
      </div>

      <div class="buttons">
        <button type="button" class="btn primary" id="calcBtn">計算</button>
        <button type="button" class="btn blue" id="resetBtn">重設</button>
      </div>
    </section>

    <section class="card">
      <h2>計算結果</h2>

      <div class="result-grid">
        <div class="result">
          <div class="k">目前燃油</div>
          <div class="v" id="resultFuelType">黃金（平油）</div>
        </div>

        <div class="result">
          <div class="k">牌價，每升</div>
          <div class="v" id="resultPumpPrice">--</div>
        </div>

        <div class="result">
          <div class="k">每升折扣</div>
          <div class="v" id="resultDiscount">--</div>
        </div>

        <div class="result">
          <div class="k">折後每升</div>
          <div class="v" id="resultNetPerLitre">--</div>
        </div>

        <div class="result">
          <div class="k">油券</div>
          <div class="v" id="resultVoucher">--</div>
        </div>

        <div class="result highlight">
          <div class="k">實付金額</div>
          <div class="v" id="resultPay">--</div>
        </div>

        <div class="result">
          <div class="k">實際每升成本</div>
          <div class="v" id="resultActualPerLitre">--</div>
        </div>

        <div class="result">
          <div class="k">油耗</div>
          <div class="v" id="resultFuelConsumption">--</div>
        </div>
      </div>

      <p class="small" id="updatedAtText">尚未載入油價。</p>
    </section>

    <div class="footer">
      油價資料來源：香港消費者委員會油價資訊通。<br />
      由 GitHub Actions 每日自動儲存至 <code>data/oilprice.json</code>。
    </div>
  </div>

  <script>
    const OIL_PRICE_API_URL = "./data/oilprice.json";

    const DEFAULT_PRICES = {
      gold: null,
      platinum: null,
      updatedAt: "",
      source: "消委會油價資訊通"
    };

    let appState = {
      fuelType: "gold",
      prices: { ...DEFAULT_PRICES }
    };

    const $ = (id) => document.getElementById(id);

    const els = {
      goldBtn: $("goldBtn"),
      platinumBtn: $("platinumBtn"),
      reloadPriceBtn: $("reloadPriceBtn"),
      manualToggleBtn: $("manualToggleBtn"),
      manualBox: $("manualBox"),
      manualGoldPrice: $("manualGoldPrice"),
      manualPlatinumPrice: $("manualPlatinumPrice"),
      applyManualBtn: $("applyManualBtn"),
      loadStatus: $("loadStatus"),
      discountCard: $("discountCard"),
      customDiscountBox: $("customDiscountBox"),
      customDiscount: $("customDiscount"),
      voucher: $("voucher"),
      customVoucherBox: $("customVoucherBox"),
      customVoucher: $("customVoucher"),
      litres: $("litres"),
      odometerKm: $("odometerKm"),
      calcBtn: $("calcBtn"),
      resetBtn: $("resetBtn"),
      themeBtn: $("themeBtn"),

      resultFuelType: $("resultFuelType"),
      resultPumpPrice: $("resultPumpPrice"),
      resultDiscount: $("resultDiscount"),
      resultNetPerLitre: $("resultNetPerLitre"),
      resultVoucher: $("resultVoucher"),
      resultPay: $("resultPay"),
      resultActualPerLitre: $("resultActualPerLitre"),
      resultFuelConsumption: $("resultFuelConsumption"),
      updatedAtText: $("updatedAtText")
    };

    function money(n) {
      if (!Number.isFinite(n)) return "--";
      return "HK$" + n.toFixed(2);
    }

    function numberValue(el, fallback = 0) {
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }

    function showStatus(message, type = "error") {
      els.loadStatus.textContent = message;
      els.loadStatus.className = "notice show" + (type === "success" ? " success" : "");
    }

    function saveState() {
      const data = {
        fuelType: appState.fuelType,
        prices: appState.prices,
        discountCard: els.discountCard.value,
        customDiscount: els.customDiscount.value,
        voucher: els.voucher.value,
        customVoucher: els.customVoucher.value,
        litres: els.litres.value,
        odometerKm: els.odometerKm.value
      };

      try {
        localStorage.setItem("caltexCalcStateV3", JSON.stringify(data));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem("caltexCalcStateV3");
        if (!raw) return;

        const data = JSON.parse(raw);

        if (data.fuelType) appState.fuelType = data.fuelType;
        if (data.prices) appState.prices = { ...DEFAULT_PRICES, ...data.prices };

        if (data.discountCard != null) els.discountCard.value = data.discountCard;
        if (data.customDiscount != null) els.customDiscount.value = data.customDiscount;
        if (data.voucher != null) els.voucher.value = data.voucher;
        if (data.customVoucher != null) els.customVoucher.value = data.customVoucher;
        if (data.litres != null) els.litres.value = data.litres;
        if (data.odometerKm != null) els.odometerKm.value = data.odometerKm;
      } catch (e) {}
    }

    function setFuelType(type) {
      appState.fuelType = type;
      els.goldBtn.classList.toggle("active", type === "gold");
      els.platinumBtn.classList.toggle("active", type === "platinum");
      calculate();
      saveState();
    }

    function getCurrentFuelName() {
      return appState.fuelType === "gold" ? "黃金（平油）" : "白金（貴油）";
    }

    function getCurrentPumpPrice() {
      return appState.fuelType === "gold"
        ? Number(appState.prices.gold)
        : Number(appState.prices.platinum);
    }

    function getDiscountPerLitre() {
      if (els.discountCard.value === "custom") {
        return numberValue(els.customDiscount, 0);
      }

      const parts = els.discountCard.value.split(",").map(Number);
      const goldDiscount = parts[0] || 0;
      const platinumDiscount = parts[1] || 0;

      return appState.fuelType === "gold" ? goldDiscount : platinumDiscount;
    }

    function getVoucherAmount() {
      if (els.voucher.value === "custom") {
        return numberValue(els.customVoucher, 0);
      }
      return Number(els.voucher.value) || 0;
    }

    function calculate() {
      const pumpPrice = getCurrentPumpPrice();
      const discount = getDiscountPerLitre();
      const litres = numberValue(els.litres, 0);
      const voucher = getVoucherAmount();
      const km = numberValue(els.odometerKm, NaN);

      els.customDiscountBox.classList.toggle("hidden", els.discountCard.value !== "custom");
      els.customVoucherBox.classList.toggle("hidden", els.voucher.value !== "custom");

      els.resultFuelType.textContent = getCurrentFuelName();

      if (!Number.isFinite(pumpPrice) || pumpPrice <= 0) {
        els.resultPumpPrice.textContent = "--";
        els.resultDiscount.textContent = money(discount);
        els.resultNetPerLitre.textContent = "--";
        els.resultVoucher.textContent = money(voucher);
        els.resultPay.textContent = "--";
        els.resultActualPerLitre.textContent = "--";
        els.resultFuelConsumption.textContent = "--";
        els.updatedAtText.textContent =
          "尚未載入有效油價。請先到 GitHub Actions 手動執行一次 Update oil price data，產生 data/oilprice.json。";
        return;
      }

      const netPerLitre = Math.max(0, pumpPrice - discount);
      const gross = netPerLitre * litres;
      const payable = Math.max(0, gross - voucher);
      const actualPerLitre = litres > 0 ? payable / litres : NaN;
      const fuelConsumption = Number.isFinite(km) && km > 0 && litres > 0
        ? (litres / km) * 100
        : NaN;

      els.resultPumpPrice.textContent = money(pumpPrice);
      els.resultDiscount.textContent = money(discount);
      els.resultNetPerLitre.textContent = money(netPerLitre);
      els.resultVoucher.textContent = money(voucher);
      els.resultPay.textContent = money(payable);
      els.resultActualPerLitre.textContent = money(actualPerLitre);
      els.resultFuelConsumption.textContent = Number.isFinite(fuelConsumption)
        ? fuelConsumption.toFixed(2) + " L / 100km"
        : "--";

      const updated = appState.prices.updatedAt
        ? "更新時間：" + appState.prices.updatedAt
        : "油價已載入。";

      els.updatedAtText.textContent =
        updated + "｜資料來源：" + (appState.prices.source || "消委會油價資訊通");

      saveState();
    }

    async function fetchOilPriceData() {
      const url = OIL_PRICE_API_URL + "?t=" + Date.now();

      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status + "，可能 data/oilprice.json 尚未建立");
      }

      return await response.json();
    }

    function flattenJson(value, output = []) {
      if (Array.isArray(value)) {
        for (const item of value) flattenJson(item, output);
      } else if (value && typeof value === "object") {
        output.push(value);
        for (const key of Object.keys(value)) {
          const child = value[key];
          if (child && typeof child === "object") {
            flattenJson(child, output);
          }
        }
      }
      return output;
    }

    function parsePriceCandidate(value) {
      if (value == null) return null;
      if (typeof value === "number" && Number.isFinite(value)) return value;

      const str = String(value)
        .replace(/HKD/gi, "")
        .replace(/HK\$/gi, "")
        .replace(/港幣/g, "")
        .replace(/\$/g, "")
        .replace(/,/g, "")
        .trim();

      const match = str.match(/\d+(?:\.\d+)?/);
      if (!match) return null;

      const n = Number(match[0]);
      if (!Number.isFinite(n)) return null;

      if (n < 10 || n > 40) return null;

      return n;
    }

    function objectText(obj) {
      try {
        return JSON.stringify(obj).toLowerCase();
      } catch (e) {
        return "";
      }
    }

    function isCaltexRow(obj) {
      const text = objectText(obj);
      return (
        text.includes("caltex") ||
        text.includes("加德士") ||
        text.includes("加德士石油")
      );
    }

    function isGoldRow(obj) {
      const text = objectText(obj);
      return (
        text.includes("黃金") ||
        text.includes("gold") ||
        text.includes("unleaded") ||
        text.includes("regular")
      );
    }

    function isPlatinumRow(obj) {
      const text = objectText(obj);
      return (
        text.includes("白金") ||
        text.includes("platinum") ||
        text.includes("premium")
      );
    }

    function extractUpdatedAt(payload, wrapper) {
      if (wrapper && wrapper.fetched_at_hkt) {
        return wrapper.fetched_at_hkt;
      }

      const rows = flattenJson(payload);
      const keys = [
        "updated",
        "update",
        "updated_at",
        "last_update",
        "lastUpdate",
        "date",
        "effective_date",
        "effectiveDate"
      ];

      for (const row of rows) {
        for (const key of keys) {
          if (row[key]) return String(row[key]);
        }
      }

      return new Date().toLocaleString("zh-HK");
    }

    function extractPriceFromObject(obj) {
      const preferredKeys = [
        "price",
        "Price",
        "retail_price",
        "RetailPrice",
        "pump_price",
        "PumpPrice",
        "oil_price",
        "OilPrice",
        "amount",
        "Amount",
        "value",
        "Value"
      ];

      for (const key of preferredKeys) {
        if (obj[key] != null) {
          const n = parsePriceCandidate(obj[key]);
          if (n != null) return n;
        }
      }

      for (const key of Object.keys(obj)) {
        const n = parsePriceCandidate(obj[key]);
        if (n != null) return n;
      }

      return null;
    }

    function parseConsumerCouncilOilPrices(wrapper) {
      const payload = wrapper && wrapper.data ? wrapper.data : wrapper;
      const rows = flattenJson(payload);

      let gold = null;
      let platinum = null;

      for (const row of rows) {
        if (!isCaltexRow(row)) continue;

        const price = extractPriceFromObject(row);
        if (price == null) continue;

        if (isPlatinumRow(row)) {
          platinum = price;
        } else if (isGoldRow(row)) {
          gold = price;
        }
      }

      if (gold == null || platinum == null) {
        for (const row of rows) {
          const price = extractPriceFromObject(row);
          if (price == null) continue;

          if (gold == null && isGoldRow(row)) gold = price;
          if (platinum == null && isPlatinumRow(row)) platinum = price;
        }
      }

      if (gold == null && platinum == null) {
        throw new Error("已讀取 data/oilprice.json，但搵唔到加德士黃金 / 白金油價");
      }

      return {
        gold,
        platinum,
        updatedAt: extractUpdatedAt(payload, wrapper),
        source: wrapper && wrapper.source
          ? wrapper.source
          : "香港消費者委員會油價資訊通"
      };
    }

    async function reloadOilPrices() {
      showStatus("正在讀取 data/oilprice.json……", "success");

      try {
        const data = await fetchOilPriceData();
        const prices = parseConsumerCouncilOilPrices(data);

        appState.prices = {
          ...appState.prices,
          ...prices
        };

        if (prices.gold != null) {
          els.manualGoldPrice.value = prices.gold.toFixed(2);
        }

        if (prices.platinum != null) {
          els.manualPlatinumPrice.value = prices.platinum.toFixed(2);
        }

        showStatus(
          "成功讀取本地油價。黃金：" +
            (prices.gold != null ? money(prices.gold) : "未找到") +
            "；白金：" +
            (prices.platinum != null ? money(prices.platinum) : "未找到"),
          "success"
        );

        calculate();
        saveState();
      } catch (error) {
        console.error(error);
        showStatus(
          "未能讀取油價。請確認 GitHub Actions 已成功產生 data/oilprice.json。錯誤：" +
            (error && error.message ? error.message : String(error)) +
            "。你仍可按「手動輸入油價」。",
          "error"
        );
        calculate();
      }
    }

    function applyManualPrices() {
      const gold = numberValue(els.manualGoldPrice, NaN);
      const platinum = numberValue(els.manualPlatinumPrice, NaN);

      if (!Number.isFinite(gold) && !Number.isFinite(platinum)) {
        showStatus("請至少輸入一個有效油價。", "error");
        return;
      }

      if (Number.isFinite(gold) && gold > 0) {
        appState.prices.gold = gold;
      }

      if (Number.isFinite(platinum) && platinum > 0) {
        appState.prices.platinum = platinum;
      }

      appState.prices.updatedAt = "手動輸入：" + new Date().toLocaleString("zh-HK");
      appState.prices.source = "手動輸入";

      showStatus("已套用手動油價。", "success");
      calculate();
      saveState();
    }

    function resetAll() {
      els.discountCard.value = "11,12";
      els.customDiscount.value = "0";
      els.voucher.value = "50";
      els.customVoucher.value = "0";
      els.litres.value = "0";
      els.odometerKm.value = "";
      setFuelType("gold");
      calculate();
      saveState();
    }

    function bindEvents() {
      els.goldBtn.addEventListener("click", () => setFuelType("gold"));
      els.platinumBtn.addEventListener("click", () => setFuelType("platinum"));

      els.reloadPriceBtn.addEventListener("click", reloadOilPrices);

      els.manualToggleBtn.addEventListener("click", () => {
        els.manualBox.classList.toggle("hidden");
      });

      els.applyManualBtn.addEventListener("click", applyManualPrices);

      [
        els.discountCard,
        els.customDiscount,
        els.voucher,
        els.customVoucher,
        els.litres,
        els.odometerKm
      ].forEach((el) => {
        el.addEventListener("input", calculate);
        el.addEventListener("change", calculate);
      });

      els.calcBtn.addEventListener("click", calculate);
      els.resetBtn.addEventListener("click", resetAll);

      els.themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("light");
        els.themeBtn.textContent = document.body.classList.contains("light") ? "🌙" : "☀️";
      });
    }

    function init() {
      bindEvents();
      loadState();

      if (appState.fuelType === "platinum") {
        setFuelType("platinum");
      } else {
        setFuelType("gold");
      }

      if (appState.prices.gold != null) {
        els.manualGoldPrice.value = Number(appState.prices.gold).toFixed(2);
      }

      if (appState.prices.platinum != null) {
        els.manualPlatinumPrice.value = Number(appState.prices.platinum).toFixed(2);
      }

      calculate();
      reloadOilPrices();
    }

    init();
  </script>
</body>
</html>
